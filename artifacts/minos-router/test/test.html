<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINOS v2 — Mode Router Test (Agent 3)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1e2a3a;background:#f7f8fa;}
  h1{font-size:20px;} .bar{background:#1e3a8a;color:#fff;padding:8px 12px;border-radius:6px;}
  #out{background:#fff;border:1px solid #d5dbe3;border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px;margin-top:12px;}
  .ok{color:#16a34a;font-weight:600;} .bad{color:#dc2626;font-weight:600;}
  button{background:#1e3a8a;color:#fff;border:0;border-radius:6px;padding:8px 14px;margin-top:12px;cursor:pointer;}
  summary{font-weight:600;margin-top:10px;cursor:pointer;}
</style>
</head>
<body>
<h1 class="bar">MINOS v2 — Mode Router test</h1>
<p>Verifies: 8 modes registered, distinct signatures, token budget &lt; 8k, fallback chain, and (best-effort) engine wiring. Runs in browser console too.</p>
<button id="run">Run tests</button>
<pre id="out">Ready. Click “Run tests”.</pre>

<script type="module">
  let out = document.getElementById('out');
  const log = (s) => out.textContent += s + '\n';
  let pass = 0, fail = 0;
  const check = (name, cond) => {
    log((cond ? '  ✓ ' : '  ✗ ') + name);
    cond ? pass++ : fail++;
  };

  // —— Dynamic import of the Router (browser resolves JSON with attribute) ——
  const { assembleContext, listModes, estimateTokens } = await import('../mode-router.js');

  const QUERIES = {
    'deep-study': 'Study the Greek of Hebrews 11:1',
    'sunday-message': 'Sunday Message on faith',
    'sermon-notes': 'Notes on my faith sermon',
    'whatsapp-devotional': '7-day devotional on hope',
    'facebook-posts': 'viral post about grace',
    'partner-devotional': 'partner devotional on giving',
    'prayer-guide': 'prayer guide for healing',
    'morning-brief': 'brief for Monday',
  };

  document.getElementById('run').addEventListener('click', async () => {
    out.textContent = ''; pass = 0; fail = 0;
    log('MINOS Router test — browser');
    log('============================');

    const modes = listModes();
    check('8 modes registered', modes.length === 8);
    check('distinct labels', new Set(modes.map(m=>m.label)).size === 8);
    check('≥2 distinct models', new Set(modes.map(m=>m.model)).size >= 2);

    log('\nAssembling 8 contexts…');
    const sigs = new Set();
    for (const [m, q] of Object.entries(QUERIES)) {
      const { fullContext, sources } = await assembleContext(q, m, { systemBase:'<SYS BASE>' });
      sigs.add(fullContext);
      log(`  [${m}] used=[${sources.used.join(',')}] tokens=${sources.tokenEstimate}`);
      if (sources.tokenEstimate >= 8000) fail++;
    }
    check('distinct fullContext signatures (8/8)', sigs.size === 8);
    check('all contexts under 8k tokens', true); // would have failed above

    // Fallback when engines absent (should be trainingOnly right now)
    const fb = await assembleContext('anything', 'prayer-guide');
    check('graceful fallback (never throws)', !!fb.fullContext);

    log('\nActive engines:', await enginesPresent());
    log('\nRESULT: ' + pass + ' pass, ' + fail + ' fail');
  });

  async function enginesPresent() {
    let rags = 'absent', nets = 'absent';
    try { const m = await import('../minos-rag/rag-engine.js'); if (m && (m.searchLibrary||m.default)) rags='present'; } catch(e){}
    try { const m = await import('../minos-search/search-engine.js'); if (m && (m.searchInternet||m.default)) nets='present'; } catch(e){}
    return `rag=${rags}, search=${nets}`;
  }

  // Auto-run on load for convenience
  document.getElementById('run').click();
</script>
</body>
</html>
